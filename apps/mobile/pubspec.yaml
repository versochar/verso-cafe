name: sosyal
description: "Nostr tabanlı, davetliye kapalı sosyal ağ istemcisi"
publish_to: 'none'
version: 1.0.4+9

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Nostr çekirdeği
  bip340: ^0.3.1        # BIP-340 Schnorr imza (secp256k1)
  crypto: ^3.0.6        # sha256
  web_socket_channel: ^3.0.0

  # Faz 2: kimlik, yedekleme, davet
  cryptography: ^2.9.0        # XChaCha20-Poly1305 (NIP-49)
  pointycastle: ^4.0.0        # scrypt (NIP-49)
  unorm_dart: ^0.3.3          # NFKC normalizasyonu (NIP-49)
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  url_launcher: ^6.2.5
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
